ext {
    // Health Connect's client library requires API 26 (Android 8) — not a
    // library quirk to override, but Health Connect's real platform floor.
    // Was 23 (Capacitor's own default) before HealthConnectSync.kt needed it.
    minSdkVersion = 26
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'

    kotlinVersion = '2.0.21'
    androidxSecurityCryptoVersion = '1.1.0-alpha06'
    // Health Connect's client library has never left alpha — production apps
    // ship on these builds regardless. See docs/samsung-health-sync.md §6.
    healthConnectVersion = '1.1.0-alpha12'
    kotlinxCoroutinesVersion = '1.8.1'
    // HealthSyncWorker.kt — periodic background sync, Phase 4.
    androidxWorkVersion = '2.9.1'
}
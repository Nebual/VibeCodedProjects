android.useAndroidX=true

# Gradle 8.11.1 (the wrapper version Capacitor pins) doesn't understand
# class files as new as JDK 25's ("Unsupported class file major version 69").
# JDK 21 is the well-tested pairing with this Gradle/AGP combo. This path is
# specific to the sandbox this was scaffolded in — a real workstation likely
# already defaults to a compatible JDK and can drop this line, or point it at
# wherever that machine's JDK 17-21 lives.
org.gradle.java.home=/usr/lib/jvm/java-1.21.0-openjdk-amd64

services:
  songtrack:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      MIDI_WORKER_URL: http://midi:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:3009:3000"
    depends_on:
      - midi

  # Audio → MIDI transcription sidecar (upstream MuScriptor, unmodified).
  midi:
    image: songtrack-midi:main-e34b397-patched
    # Pinned to a commit, not a release: /sheets (engraving) landed after v0.3.0 and no tag
    # carries it. See the header of bin/build-midi-sidecar.sh.
    # No `build:` — see bin/build-midi-sidecar.sh. gman-deploy.sh runs `up --build`
    # on every deploy and this image takes minutes to build.
    # No `ports:` — this service has no auth of its own and must only ever be
    # reachable from the songtrack container over the internal Docker network.
    pull_policy: never
    restart: unless-stopped
    command: ["--model", "medium", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # NB: this deliberately points away from the HF cache the image prewarms, which is where
      # its soundfonts live — so bin/fetch-midi-model.sh must fetch MuScriptor/assets into this
      # volume as well as the model. Without them /auralize and /soundfonts/... fail with a
      # bare 500 ("cannot find the requested files in the local cache").
      HF_HOME: /hf-cache
      # Fail loudly at boot on an incomplete cache rather than silently pulling
      # 1.2 GB onto the production disk. Populate it with bin/fetch-midi-model.sh.
      HF_HUB_OFFLINE: "1"
      # torch will otherwise grab every core and starve the ffmpeg renders that
      # are this app's actual day job. The cpus limit below is the real bound;
      # this stops torch from thrashing threads it can't run.
      OMP_NUM_THREADS: "4"
    volumes:
      - ./cache/midi-cache:/hf-cache:ro
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8g

  # Optional GPU tier. Opt in with:  docker compose --profile gpu up -d
  # and set MIDI_WORKER_GPU_URL=http://midi-gpu:8000 in .env so the app looks for it.
  #
  # Left out of the default profile on purpose: without the NVIDIA Container Toolkit installed,
  # `docker compose up -d` would fail outright on a CPU-only box. And without the env var set, the
  # app never probes for a GPU at all, so a stopped GPU tier costs nothing.
  #
  # Nothing here is a second copy of the app: it is the same image as `midi`, given a bigger model
  # and a CUDA device. Songtrack probes its /health and falls back to the CPU tier whenever it
  # doesn't answer, so this can be stopped and started freely.
  midi-gpu:
    image: songtrack-midi:main-e34b397-patched
    profiles: ["gpu"]
    pull_policy: never
    restart: unless-stopped
    command: ["--model", "large", "--device", "cuda", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      HF_HOME: /hf-cache
      HF_HUB_OFFLINE: "1"
      # `large` (1.4B params, kept fp32 on CUDA) is right at the edge of an 8GB
      # card. A CUDA OOM here that reports only tens of MiB missing, alongside
      # unallocated-but-reserved memory of similar size, is allocator
      # fragmentation, not a true capacity shortfall — this tells PyTorch's
      # allocator to grow/merge segments instead of hitting that wall.
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    volumes:
      # The `large` weights are a separate download — see bin/fetch-midi-model.sh large.
      - ./cache/midi-cache:/hf-cache:ro
    ports:
      - "8196:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

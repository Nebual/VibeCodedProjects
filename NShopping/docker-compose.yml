# Persistent OCR service for the take-a-photo flow: llama-server running Qwen3-VL-2B,
# GPU-accelerated on an Nvidia GTX 1070 (Pascal / sm_61) via CUDA. Reuses the image built
# for ocr-benchmark/. Requires the host to have the nvidia driver (580.x branch) and
# nvidia-container-toolkit installed so `deploy.resources.reservations.devices` below can
# pass the GPU through — no CUDA toolkit needed on the host itself.
#
# Model picked via ocr-benchmark/: Qwen3-VL-2B-Instruct beat Qwen2.5-VL-3B on both
# accuracy and latency in that harness. Rebuild the image (not just restart) when bumping
# the model, since the Dockerfile clones llama.cpp master and Qwen3-VL needs a recent build.
#
#   docker compose up -d ocr        # start (first boot downloads ~2.5GB, then stays warm)
#   docker compose logs -f ocr      # watch model load / requests
#
# The app reaches it at http://localhost:8191 by default (override with OCR_SERVER_URL).
services:
  ocr:
    build:
      context: ./ocr-benchmark
      dockerfile: Dockerfile.nvidia
    # Expose the GPU via the Compose device-reservation API (requires nvidia-container-toolkit).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Override the image's benchmark entrypoint: keep the model resident and serve HTTP.
    entrypoint: ["/usr/local/bin/llama-server"]
    command:
      - -hf
      - ggml-org/Qwen3-VL-2B-Instruct-GGUF:Q8_0
      - -ngl
      - "99"              # all layers on the GPU
      - --host
      - "0.0.0.0"         # bind inside the container so the published port works
      - --port
      - "8191"
      - -c
      - "8192"
    # Publish to the host loopback only — same-box app, never the public internet.
    ports:
      - "127.0.0.1:8191:8191"
    # Persist downloaded weights so restarts don't re-download.
    volumes:
      - ocr-cache:/root/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s  # first start downloads + loads the model

volumes:
  ocr-cache:

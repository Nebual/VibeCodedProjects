# Run this on the WORKER node (192.168.0.162). It exposes local GPU compute
# over the ggml RPC protocol for the primary node to offload layers to.
#
# SECURITY: the RPC protocol has no auth/encryption - upstream llama.cpp
# explicitly warns "never expose the RPC server to an open network". Binding
# to 0.0.0.0 here is required for the primary node to reach it through
# Docker's port publishing, so lock this down at the firewall instead - see
# README.md for a ufw rule that only allows the primary node's IP through.
services:
  llama-rpc-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-60;61;70;75;80;86;89;90}
    image: llama-cpp-rpc:latest
    container_name: llama-rpc-worker
    entrypoint: ["/app/bin/ggml-rpc-server"]
    command:
      - --host=0.0.0.0
      - --port=${RPC_PORT:-50052}
    ports:
      - "${RPC_PORT:-50052}:${RPC_PORT:-50052}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

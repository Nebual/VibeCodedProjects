# Remote synthesis node — runs on the GPU machine, not the Linux host.
#
#   docker compose -f docker-compose.node.yml up --build
#
# Needs the NVIDIA Container Toolkit. On Windows that means Docker Desktop with
# the WSL2 backend and a current driver; `docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi`
# should print your card before
# you try this.
#
# Running it outside Docker is often simpler on Windows:
#
#   uv sync
#   uv pip install onnxruntime-gpu       # replaces onnxruntime
#   set NAB_ROLE=worker-node
#   set NAB_MODELS_DIR=C:\path\to\models
#   set NAB_REMOTE_WORKER_TOKEN=<shared secret>
#   uv run uvicorn naudiobooker.main:app --host 0.0.0.0 --port 8001
#
# Either way, check GET /node/health and confirm the log says
# "Kokoro running on CUDAExecutionProvider". If it says CPU, onnxruntime-gpu is
# not installed or cannot see the card, and the node will be slower than the
# machine you were trying to offload from.

#
# Three services, all optional -- bring up only the models you want:
#
#   docker compose -f docker-compose.node.yml up -d node            # Kokoro
#   docker compose -f docker-compose.node.yml up -d node-omnivoice
#   docker compose -f docker-compose.node.yml up -d node-chatterbox
#
# chatterbox and omnivoice are separate containers because they cannot share a
# Python environment: chatterbox-tts pins transformers==5.2.0 and omnivoice
# needs >=5.3.0. The conflict is at import time, so two processes are required
# whatever the packaging -- two venvs in one container would need a supervisor
# to arrange the same thing.
#
# Both load their model lazily, so only the one you actually use occupies the
# card. They will not both fit in 8 GB at once; stop the idle one to reclaim it.
#
# On the primary host, point each model at its port:
#
#   NAB_TTS_BACKEND=remote
#   NAB_REMOTE_MODEL_URLS={"omnivoice":"http://gpu-box:8002","chatterbox-original":"http://gpu-box:8003"}
#   NAB_REMOTE_WORKER_URL=http://gpu-box:8001
#
services:
  node:
    build:
      context: ./api
      dockerfile: Dockerfile.gpu
      args:
        # Defaults target CUDA 13. Drivers are backward compatible, so a CUDA
        # 13 driver also runs CUDA 12 images, but not the reverse. For an older
        # driver, override both together -- the CUDA major version of the base
        # image and of the onnxruntime-gpu wheel have to match:
        #
        #   CUDA_IMAGE=nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04
        #   ONNXRUNTIME_GPU=onnxruntime-gpu>=1.21,<1.27
        #
        # A mismatch fails the build rather than shipping an image that
        # silently runs on CPU.
        CUDA_IMAGE: ${CUDA_IMAGE:-nvidia/cuda:13.0.1-cudnn-runtime-ubuntu24.04}
        ONNXRUNTIME_GPU: ${ONNXRUNTIME_GPU:-onnxruntime-gpu}
    environment:
      NAB_ROLE: worker-node
      NAB_MODELS_DIR: /models
      NAB_TTS_DEVICE: cuda
      # Must match NAB_REMOTE_WORKER_TOKEN on the Linux host. The node will
      # synthesize for anyone who can reach it if this is unset.
      NAB_REMOTE_WORKER_TOKEN: ${NAB_REMOTE_WORKER_TOKEN:?set a shared token}
    volumes:
      # The weights are read locally, so this machine needs its own copy --
      # they do not come from the primary host, and models/ is gitignored so a
      # fresh checkout has none. Run ../scripts/fetch-models.ps1 (or .sh) here
      # first, or /node/health will report the files as missing.
      - ./models:/models:ro
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  node-omnivoice:
    build:
      context: ./api
      dockerfile: Dockerfile.model-node
      args:
        MODEL_EXTRA: omnivoice
    environment:
      NAB_ROLE: worker-node
      NAB_TTS_MODEL: omnivoice
      NAB_TTS_DEVICE: cuda
      NAB_MODELS_DIR: /models
      NAB_REMOTE_WORKER_TOKEN: ${NAB_REMOTE_WORKER_TOKEN:?set a shared token}
    volumes:
      # Weights land in HF_HOME under here, so they survive a container rebuild.
      - ./models:/models
    ports:
      - "8002:8000"
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    profiles: ["omnivoice"]

  node-chatterbox:
    build:
      context: ./api
      dockerfile: Dockerfile.model-node
      args:
        MODEL_EXTRA: chatterbox
    environment:
      NAB_ROLE: worker-node
      NAB_TTS_MODEL: chatterbox-original
      NAB_TTS_DEVICE: cuda
      NAB_MODELS_DIR: /models
      NAB_REMOTE_WORKER_TOKEN: ${NAB_REMOTE_WORKER_TOKEN:?set a shared token}
    volumes:
      - ./models:/models
    ports:
      - "8003:8000"
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    profiles: ["chatterbox"]
